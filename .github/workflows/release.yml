name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/TeTS.Integrations/TeTS.Integrations.csproj)
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match csproj <Version>$CSPROJ_VERSION</Version>" >&2
            exit 1
          fi
      - uses: actions/setup-dotnet@v6
        with:
          # .NET 6 runtime so the pre-pack `dotnet test` executes the net6.0 target on a real
          # net6 runtime; .NET 8 SDK builds and packs all target frameworks.
          dotnet-version: |
            6.0.x
            8.0.x
      - run: dotnet build --configuration Release /p:ContinuousIntegrationBuild=true
      - run: dotnet test --configuration Release --no-build
        env:
          TZ: UTC
      - run: dotnet pack src/TeTS.Integrations --configuration Release --no-build --output ./artifacts
      # NuGet Trusted Publishing: exchanges this workflow's GitHub OIDC token for a
      # short-lived nuget.org API key — no stored secret. Depends on the Trusted
      # Publishing policy configured on nuget.org under package owner `olivelliott`
      # for repository `your-training-provider/tets-integrations-dotnet`, workflow
      # file `release.yml`. If pushes start failing with 401/403, check that policy.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: olivelliott
      - run: dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
